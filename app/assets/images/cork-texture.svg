      <feFuncG type="linear" slope="0.36" intercept="0.25"/>
      <feFuncB type="linear" slope="0.3" intercept="0.2"/>
      <feFuncA type="linear" slope="0.22"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" in2="soft-noise" mode="soft-light"/>
  </filter>

